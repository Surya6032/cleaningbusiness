<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Total Care Cleaning Melbourne — Professional Cleaning & Property Maintenance Solutions for residential, commercial, and government clients.">
    <meta name="theme-color" content="#000000">
    <title>Total Care Cleaning Melbourne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #000000;
            --white: #FFFFFF;
            --gray-50: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-300: #D4D4D4;
            --gray-400: #A3A3A3;
            --gray-500: #737373;
            --gray-600: #525252;
            --gray-700: #404040;
            --gray-800: #262626;
            --gray-900: #171717;
            --gray-950: #0A0A0A;

            --font-heading: 'Space Grotesk', 'Inter', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-body);
            color: var(--gray-900);
            background: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        ul { list-style: none; }

        /* Skip Link */
        .skip-link {
            position: absolute; top: -100%; left: 16px;
            background: var(--black); color: var(--white);
            padding: 12px 24px; z-index: 10000;
            font-size: 0.875rem; border-radius: 0 0 4px 4px;
            transition: top 0.2s;
        }
        .skip-link:focus { top: 0; }

        /* Focus */
        *:focus-visible {
            outline: 2px solid var(--black);
            outline-offset: 2px;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 1000;
            padding: 20px 0;
            transition: all 0.4s var(--ease-out);
            background: transparent;
        }

        .navbar.scrolled {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 0;
            border-bottom: 1px solid var(--gray-200);
        }

        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: var(--white);
            transition: color 0.4s;
        }
        .nav-brand span { font-weight: 400; color: var(--gray-400); }
        .navbar.scrolled .nav-brand { color: var(--black); }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            font-size: 0.8125rem;
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute; bottom: -4px; left: 0;
            width: 0; height: 1px;
            background: currentColor;
            transition: width 0.3s var(--ease-out);
        }
        .nav-links a:hover::after,
        .nav-links a.active::after { width: 100%; }
        .nav-links a:hover { color: var(--white); }
        .navbar.scrolled .nav-links a { color: var(--gray-500); }
        .navbar.scrolled .nav-links a:hover,
        .navbar.scrolled .nav-links a.active { color: var(--black); }

        .nav-cta {
            font-size: 0.8125rem !important;
            font-weight: 600 !important;
            color: var(--black) !important;
            background: var(--white);
            padding: 10px 24px;
            border-radius: 100px;
            transition: all 0.3s var(--ease-out) !important;
            letter-spacing: 0.02em;
        }
        .nav-cta::after { display: none !important; }
        .nav-cta:hover {
            background: var(--gray-100) !important;
            color: var(--black) !important;
            transform: translateY(-1px);
        }
        .navbar.scrolled .nav-cta {
            background: var(--black) !important;
            color: var(--white) !important;
        }
        .navbar.scrolled .nav-cta:hover {
            background: var(--gray-800) !important;
            color: var(--white) !important;
        }

        /* Hamburger */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none; border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
        }
        .hamburger span {
            display: block; width: 24px; height: 1.5px;
            background: var(--white);
            transition: all 0.3s var(--ease-out);
        }
        .navbar.scrolled .hamburger span { background: var(--black); }
        .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        /* Mobile Nav */
        .mobile-nav {
            display: none;
            position: fixed; inset: 0;
            background: var(--white);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            opacity: 0;
            transition: opacity 0.4s var(--ease-out);
        }
        .mobile-nav.open { display: flex; opacity: 1; }
        .mobile-nav a {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 600;
            color: var(--black);
            padding: 16px;
            letter-spacing: -0.02em;
            transition: opacity 0.2s;
        }
        .mobile-nav a:hover { opacity: 0.5; }

        /* ========== HERO ========== */
        .hero {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--black);
            position: relative;
            overflow: hidden;
            padding: 120px 24px 80px;
        }

        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.02) 0%, transparent 40%);
        }

        .hero-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent);
            -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent);
        }

        .hero-content {
            position: relative; z-index: 1;
            text-align: center;
            max-width: 820px;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--gray-400);
            margin-bottom: 40px;
        }
        .hero-label .dot {
            width: 6px; height: 6px;
            background: var(--white);
            border-radius: 50%;
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: var(--white);
            margin-bottom: 24px;
        }
        .hero h1 .light { font-weight: 300; color: var(--gray-400); }

        .hero-sub {
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 300;
            color: var(--gray-400);
            max-width: 540px;
            margin: 0 auto 20px;
            line-height: 1.7;
        }

        .hero-tags {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }
        .hero-tags span {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--gray-500);
        }
        .hero-tags .sep {
            width: 4px; height: 4px;
            background: var(--gray-600);
            border-radius: 50%;
        }

        .hero-btns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 36px;
            background: var(--white);
            color: var(--black);
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            letter-spacing: 0.01em;
        }
        .btn-primary:hover { background: var(--gray-200); transform: translateY(-2px); }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 16px 36px;
            background: transparent;
            color: var(--white);
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 500;
            border: 1px solid var(--gray-700);
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            letter-spacing: 0.01em;
        }
        .btn-outline:hover { border-color: var(--gray-400); transform: translateY(-2px); }

        .scroll-line {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            width: 1px; height: 60px;
            background: linear-gradient(to bottom, transparent, var(--gray-600), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }
        @keyframes scrollPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* ========== SECTIONS ========== */
        .section { padding: 120px 24px; }
        .section-alt { background: var(--gray-50); }
        .section-dark { background: var(--black); color: var(--white); }

        .section-inner {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header { margin-bottom: 72px; }

        .section-label {
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--gray-400);
            margin-bottom: 16px;
        }
        .section-dark .section-label { color: var(--gray-500); }

        .section-title {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--gray-900);
        }
        .section-dark .section-title { color: var(--white); }

        .section-divider {
            width: 40px; height: 1px;
            background: var(--gray-300);
            margin-top: 24px;
        }
        .section-dark .section-divider { background: var(--gray-700); }

        /* ========== ABOUT ========== */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .about-text {
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--gray-600);
            font-weight: 300;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .stat-item {
            padding: 24px 0;
            border-top: 1px solid var(--gray-200);
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--black);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-text {
            font-size: 0.8125rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        /* ========== SERVICES ========== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .service-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 12px;
            padding: 40px 32px;
            transition: all 0.4s var(--ease-out);
            position: relative;
            overflow: hidden;
        }
        .service-card:hover {
            border-color: var(--black);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .service-icon {
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 28px;
        }
        .service-icon svg {
            width
